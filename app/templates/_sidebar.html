<aside class="sidebar" aria-label="主导航">

  </div>
  <nav class="sidebar-nav">
    <p class="nav-label">系统配置</p>

    <p class="nav-label">对比工具</p>

    <a class="nav-item{% if active_page == 'history' %} active{% endif %}" href="/compare/history"{% if active_page == 'history' %} aria-current="page"{% endif %}><span class="nav-icon" aria-hidden="true">▤</span><span>历史任务</span></a>
  </nav>
  <div class="sidebar-footer">
    <span class="sidebar-readonly"><span class="status-dot status-ok"></span> SVN 只读</span>
    <span class="sidebar-version">{% if active_page == 'diff_plans' %}M4 · 表格计划对比{% elif active_page == 'monitor' %}M3 · 每日监控{% else %}Web 工作台{% endif %}</span>
  </div>
</aside>
